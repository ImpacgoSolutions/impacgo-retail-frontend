<!DOCTYPE html>
<html>
<head>
  <script>
    // Auto-detect base href for GitHub Pages subfolder deployments or local root
    (function () {
      var baseHref = '/';
      if (baseHref === '/' || baseHref === '/') {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        // If hosted on GitHub Pages subfolder (e.g. https://<user>.github.io/<repo>/)
        if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
          baseHref = '/' + segments[0] + '/';
        } else {
          baseHref = '/';
        }
      }
      var base = document.createElement('base');
      base.href = baseHref;
      document.head.appendChild(base);
    })();
  </script>
